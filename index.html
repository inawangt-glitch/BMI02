<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BMI Kawaii Calculator</title><style>body{font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#FFFDF8,#FFF3B0,#FFD6E7,#f8e8d8);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.container{max-width:700px;width:100%;background:rgba(255,255,255,.93);padding:30px;border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.15)}h1{text-align:center;color:#FF8FB1}input,select,button{width:100%;padding:12px;margin-top:6px;border-radius:15px;border:2px solid #FFD6E7}button{background:#FF8FB1;color:#fff;font-weight:bold;cursor:pointer}.result{display:none;margin-top:20px;padding:15px;border-radius:20px}.flower{position:fixed;top:-30px;animation:fall linear infinite} @keyframes fall{to{transform:translateY(120vh)}} table{width:100%;margin-top:20px;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;text-align:center}</style></head><body><div class="container"><h1>🐰 BMI Kawaii Calculator 💖</h1><label>อายุ</label><input id="age" type="number" step="0.1"><label>เพศ</label><select id="gender"><option>ชาย</option><option>หญิง</option></select><label>น้ำหนัก (kg)</label><input id="weight" type="number" step="0.1"><label>ส่วนสูง (cm)</label><input id="height" type="number" step="0.1"><button onclick="calc()">คำนวณ BMI</button><div id="result" class="result"><h2 id="bmi"></h2><h3 id="status"></h3><p id="ideal"></p><p id="advice"></p><p id="note"></p></div><table><tr><th>BMI</th><th>ระดับ</th></tr><tr><td><18.5</td><td>น้ำหนักน้อย</td></tr><tr><td>18.5-22.9</td><td>ปกติ</td></tr><tr><td>23-24.9</td><td>น้ำหนักเกิน</td></tr><tr><td>25-29.9</td><td>อ้วนระดับ 1</td></tr><tr><td>>=30</td><td>อ้วนระดับ 2</td></tr></table></div><script>for(let i=0;i<15;i++){let f=document.createElement('div');f.className='flower';f.innerHTML='🌸';f.style.left=Math.random()*100+'vw';f.style.animationDuration=(5+Math.random()*5)+'s';document.body.appendChild(f)}function calc(){let a=parseFloat(age.value),w=parseFloat(weight.value),h=parseFloat(height.value);if(!a||!w||!h){alert('กรอกข้อมูลให้ครบ');return;}let m=h/100,b=w/(m*m),s='',c='#fff';if(b<18.5){s='🩵 น้ำหนักน้อย';c='#CDEFFF'}else if(b<23){s='💚 ปกติ';c='#D6FFD8'}else if(b<25){s='💛 น้ำหนักเกิน';c='#FFF4B5'}else{s='💖 ควรดูแลสุขภาพเพิ่ม';c='#FFD6D6'}result.style.display='block';result.style.background=c;bmi.innerText='BMI = '+b.toFixed(2);status.innerText=s;ideal.innerText='น้ำหนักเหมาะสม: '+(18.5*m*m).toFixed(1)+' - '+(22.9*m*m).toFixed(1)+' กก.';advice.innerText='🐰 ดูแลสุขภาพ พักผ่อนให้เพียงพอ และออกกำลังกายสม่ำเสมอ';note.innerText=a<18?'⚠️ อายุต่ำกว่า 18 ปี ควรใช้ BMI-for-Age Percentile ร่วมด้วย':''}</script></body></html>
